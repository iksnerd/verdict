[project]
name = "verdict"
version = "0.6.3"
description = "A typed decision API: state + typed questions in, calibrated probabilities out."
requires-python = ">=3.11.4,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "rich-argparse>=1.8.0",
]

[project.scripts]
verdict = "verdict.cli:main"

[project.optional-dependencies]
laya = [
    "laya>=0.3.20",
]
mlx = [
    "laya-mlx>=0.2.0",
]
bench = [
    "datasets>=5.0.1",
]
cloud = [
    "modal>=1.5.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

# `verdict docs` reads these from an installed tool; tests/test_docs_cmd.py keeps the list whole.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "verdict/_docs/README.md"
"docs/guide.md" = "verdict/_docs/guide.md"
"docs/api.md" = "verdict/_docs/api.md"
"docs/FINDINGS.md" = "verdict/_docs/FINDINGS.md"
"docs/pipeline.md" = "verdict/_docs/pipeline.md"
"docs/routing.md" = "verdict/_docs/routing.md"
# `verdict examples` reads these from an installed tool the same way.
"examples" = "verdict/_examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
